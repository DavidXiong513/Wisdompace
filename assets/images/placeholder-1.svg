<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F5E6D3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#E8D4B8;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#E8C872;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#C9A66B;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="800" height="400" fill="url(#warmGradient)"/>
    
    <!-- Subtle tech grid -->
    <g opacity="0.1">
        <line x1="0" y1="50" x2="800" y2="50" stroke="#00F0FF" stroke-width="1"/>
        <line x1="0" y1="150" x2="800" y2="150" stroke="#00F0FF" stroke-width="1"/>
        <line x1="0" y1="250" x2="800" y2="250" stroke="#00F0FF" stroke-width="1"/>
        <line x1="0" y1="350" x2="800" y2="350" stroke="#00F0FF" stroke-width="1"/>
        <line x1="100" y1="0" x2="100" y2="400" stroke="#00F0FF" stroke-width="1"/>
        <line x1="300" y1="0" x2="300" y2="400" stroke="#00F0FF" stroke-width="1"/>
        <line x1="500" y1="0" x2="500" y2="400" stroke="#00F0FF" stroke-width="1"/>
        <line x1="700" y1="0" x2="700" y2="400" stroke="#00F0FF" stroke-width="1"/>
    </g>
    
    <!-- Decorative circles -->
    <circle cx="400" cy="200" r="100" fill="url(#accentGradient)" opacity="0.2"/>
    <circle cx="400" cy="200" r="70" fill="url(#accentGradient)" opacity="0.3"/>
    <circle cx="400" cy="200" r="40" fill="url(#accentGradient)" opacity="0.4"/>
    
    <!-- Text -->
    <text x="400" y="190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#3D2B1F" font-weight="300">配图更新中</text>
    <text x="400" y="220" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#5D4A3A">敬请期待</text>
</svg>
