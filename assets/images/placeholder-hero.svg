<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="heroGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#E8D4B8;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F5E6D3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#D9C4A9;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="1920" height="600" fill="url(#heroGradient)"/>
    
    <!-- Subtle tech grid overlay -->
    <g opacity="0.05">
        <line x1="0" y1="100" x2="1920" y2="100" stroke="#00F0FF" stroke-width="2"/>
        <line x1="0" y1="200" x2="1920" y2="200" stroke="#00F0FF" stroke-width="2"/>
        <line x1="0" y1="300" x2="1920" y2="300" stroke="#00F0FF" stroke-width="2"/>
        <line x1="0" y1="400" x2="1920" y2="400" stroke="#00F0FF" stroke-width="2"/>
        <line x1="0" y1="500" x2="1920" y2="500" stroke="#00F0FF" stroke-width="2"/>
        <line x1="200" y1="0" x2="200" y2="600" stroke="#00F0FF" stroke-width="2"/>
        <line x1="600" y1="0" x2="600" y2="600" stroke="#00F0FF" stroke-width="2"/>
        <line x1="1000" y1="0" x2="1000" y2="600" stroke="#00F0FF" stroke-width="2"/>
        <line x1="1400" y1="0" x2="1400" y2="600" stroke="#00F0FF" stroke-width="2"/>
        <line x1="1800" y1="0" x2="1800" y2="600" stroke="#00F0FF" stroke-width="2"/>
    </g>
    
    <!-- Decorative pattern -->
    <circle cx="960" cy="300" r="200" fill="#E8C872" opacity="0.15"/>
    <circle cx="960" cy="300" r="150" fill="#E8C872" opacity="0.2"/>
    <circle cx="960" cy="300" r="100" fill="#E8C872" opacity="0.25"/>
    
    <!-- Text -->
    <text x="960" y="305" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#3D2B1F" font-weight="300">篇章封面配图</text>
    <text x="960" y="345" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#5D4A3A">即将上线</text>
</svg>
